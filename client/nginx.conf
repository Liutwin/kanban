# ============================================================
# nginx.conf – Reverse proxy + SSL + SPA React
# Projet Kanban SI-SOR 2026
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile on;

    # ── Redirect HTTP → HTTPS ────────────────────────────────
    server {
        listen 8080;
        server_name _;

        return 301 https://$host:8443$request_uri;
    }

    # ── Serveur principal HTTPS ──────────────────────────────
    server {
        listen 8443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;

        client_max_body_size 20M;

        # ── Proxy WebSocket vers Deno ─────────────────────────
        # DOIT être déclaré AVANT le bloc /api/v1/ pour avoir la
        # priorité (nginx choisit le préfixe le plus long en premier,
        # mais un bloc dédié /ws/ est plus explicite et sans ambiguïté).
        location /ws/ {
            proxy_pass          http://deno:8080;

            # HTTP/1.1 obligatoire : HTTP/1.0 (défaut nginx) ne supporte
            # pas le mécanisme d'upgrade et coupe le handshake WebSocket.
            proxy_http_version  1.1;

            # Headers d'upgrade : sans eux nginx ne transmet pas la
            # demande de passage en protocole WebSocket au backend.
            proxy_set_header    Upgrade                $http_upgrade;
            proxy_set_header    Connection             "upgrade";

            proxy_set_header    Host                   $host;
            proxy_set_header    X-Real-IP              $remote_addr;
            proxy_set_header    X-Forwarded-For        $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto      $scheme;

            # Le JWT d'authentification transite via Sec-WebSocket-Protocol
            # (seul header que le navigateur autorise sur un handshake WS).
            # Sans cette ligne nginx le supprime et Deno reçoit null → 401.
            proxy_set_header    Sec-WebSocket-Protocol $http_sec_websocket_protocol;

            # Les connexions WebSocket sont long-lived : le timeout par
            # défaut (60 s) fermerait toute connexion inactive plus d'une
            # minute. 1 h est un bon compromis pour une app Kanban.
            proxy_read_timeout  3600s;
            proxy_send_timeout  3600s;
        }

        # ── Swagger UI (accès direct à Spring, sans passer par Deno) ──
        # Ces deux blocs ont un préfixe plus long que /api/v1/ → nginx
        # les matche en priorité et les envoie directement à Spring.
        # Le context-path Spring étant /api/v1, les URLs réelles sont :
        #   https://localhost:8443/api/v1/swagger-ui/index.html
        #   https://localhost:8443/api/v1/api-docs
        location /api/v1/swagger-ui/ {
            proxy_pass          http://spring:8081;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        location /api/v1/api-docs {
            proxy_pass          http://spring:8081;
            proxy_http_version  1.1;
            proxy_set_header    Host              $host;
            proxy_set_header    X-Forwarded-Proto $scheme;
        }

        # ── Proxy HTTP vers Deno pour toutes les routes /api/v1 ───
        location /api/v1/ {
            proxy_pass          http://deno:8080;

            # HTTP/1.1 requis pour que le keep-alive fonctionne
            # correctement entre nginx et Deno (bonne pratique).
            proxy_http_version  1.1;

            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            proxy_read_timeout  60s;
        }

        # ── Fichiers statiques React (SPA) ───────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;

            try_files $uri $uri/ /index.html;
        }
    }
}
