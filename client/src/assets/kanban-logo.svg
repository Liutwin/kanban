<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" width="320" height="100">
  <!-- Outer hex ring segments -->
  <polyline points="50,8 78,24 78,56" fill="none" stroke="#7c6ff0" stroke-width="2" stroke-linecap="round" opacity="0.9"/>
  <polyline points="78,56 50,72 22,56" fill="none" stroke="#7c6ff0" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  <polyline points="22,56 22,24 50,8"  fill="none" stroke="#7c6ff0" stroke-width="2" stroke-linecap="round" opacity="0.75"/>
  <polygon points="50,8 78,24 78,56 50,72 22,56 22,24" fill="none" stroke="#7c6ff0" stroke-width="1.5" opacity="0.25"/>

  <!-- Mid hex -->
  <polygon points="50,18 70,30 70,54 50,66 30,54 30,30" fill="#2b2930" stroke="#7c6ff0" stroke-width="1" opacity="0.7"/>

  <!-- Inner hex -->
  <polygon points="50,28 64,36 64,54 50,62 36,54 36,36" fill="#7c6ff0" stroke="#b0a6ff" stroke-width="1"/>

  <!-- Kanban bars inside inner hex -->
  <rect x="39" y="38" width="5" height="16" rx="1.5" fill="#b0a6ff" opacity="0.5"/>
  <rect x="47" y="34" width="5" height="20" rx="1.5" fill="#e8e0f0" opacity="0.95"/>
  <rect x="55" y="41" width="5" height="13" rx="1.5" fill="#b0a6ff" opacity="0.65"/>

  <!-- Corner ticks -->
  <path d="M14,16 L14,10 L20,10" fill="none" stroke="#7c6ff0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M86,16 L86,10 L80,10" fill="none" stroke="#7c6ff0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M14,64 L14,70 L20,70" fill="none" stroke="#7c6ff0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M86,64 L86,70 L80,70" fill="none" stroke="#7c6ff0" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Vertex dots -->
  <circle cx="50" cy="8"  r="2.5" fill="#b0a6ff"/>
  <circle cx="78" cy="24" r="2"   fill="#7c6ff0"/>
  <circle cx="78" cy="56" r="2"   fill="#7c6ff0"/>
  <circle cx="50" cy="72" r="2.5" fill="#b0a6ff"/>
  <circle cx="22" cy="56" r="2"   fill="#7c6ff0"/>
  <circle cx="22" cy="24" r="2"   fill="#7c6ff0"/>

  <!-- Logotype -->
  <text x="100" y="48"
        font-family="'DM Sans', 'DM Mono', monospace"
        font-size="32" font-weight="700"
        fill="#e8e0f0"
        letter-spacing="5">KANBAN</text>

  <!-- Underline accent -->
  <rect x="100" y="60" width="152" height="1.5" rx="1" fill="#7c6ff0" opacity="0.5"/>

  <!-- Tagline -->
  <text x="100" y="76"
        font-family="'DM Mono', monospace"
        font-size="9" font-weight="500"
        fill="#7a7288"
        letter-spacing="3">GESTION DE TÂCHES</text>
</svg>
