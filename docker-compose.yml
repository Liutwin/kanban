# ============================================================
# docker-compose.yml – Kanban SI-SOR 2026
#
# 3 services construits localement :
#   nginx   → point d'entrée unique (80/443), sert React, proxy vers Deno
#   deno    → auth JWT + proxy vers Spring (interne uniquement)
#   spring  → API REST métier (interne uniquement)
#
# Les bases de données (MariaDB + MongoDB) sont externalisées
# sur obiwan.univ-brest.fr — aucun service BDD ici.
# ============================================================

services:

  # ── nginx + React ─────────────────────────────────────────
  nginx:
    build:
      context: ./client          # dossier contenant le Dockerfile React
    container_name: kanban-nginx
    ports:
      - "80:80"                  # HTTP  → redirigé vers HTTPS par nginx
      - "443:443"                # HTTPS → point d'entrée principal
    depends_on:
      deno:
        condition: service_healthy
    restart: unless-stopped

  # ── Deno (auth JWT + proxy) ────────────────────────────────
  deno:
    build:
      context: ./deno            # dossier contenant le Dockerfile Deno
    container_name: kanban-deno
    # Pas de ports exposés : seul nginx communique avec Deno
    expose:
      - "8080"
    environment:
      # Écoute sur toutes les interfaces du container (obligatoire sous Docker)
      HOST: "0.0.0.0"
      PORT: "8080"
      # URL interne vers Spring (nom du service Docker Compose)
      SPRING_URL: "http://spring:8080"
      # Connexion MariaDB externe
      DB_HOST: "${DB_HOST}"
      DB_PORT: "${DB_PORT}"
      DB_NAME: "${DB_NAME}"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      # Clé secrète JWT
      JWT_SECRET: "${JWT_SECRET}"
    depends_on:
      - spring
    restart: unless-stopped

  # ── Spring Boot (API REST métier) ─────────────────────────
  spring:
    build:
      context: ./spring          # dossier contenant le Dockerfile Spring
    container_name: kanban-spring
    # Pas de ports exposés : seul Deno communique avec Spring
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: "prod"
      # Connexion MariaDB externe
      SPRING_DATASOURCE_URL: "${DB_MARIA_URL}"
      SPRING_DATASOURCE_USERNAME: "${DB_MARIA_USER}"
      SPRING_DATASOURCE_PASSWORD: "${DB_MARIA_PASSWORD}"
      # Connexion MongoDB externe
      SPRING_DATA_MONGODB_URI: "${DB_MONGO_URL}"
      # Config mail
      SPRING_MAIL_HOST: "${MAIL_HOST}"
      SPRING_MAIL_PORT: "${MAIL_PORT}"
      SPRING_MAIL_USERNAME: "${MAIL_USERNAME}"
      SPRING_MAIL_PASSWORD: "${MAIL_PASSWORD}"
      # Dossier des uploads (doit correspondre au volume ci-dessous)
      APP_UPLOAD_DIR: "/app/uploads"
    volumes:
      # Les fichiers uploadés survivent aux redémarrages du container
      - uploads_data:/app/uploads
    restart: unless-stopped

# ── Volumes persistants ────────────────────────────────────
volumes:
  uploads_data:
    driver: local
