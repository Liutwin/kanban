# ============================================================
# nginx.conf – Reverse proxy + SSL + SPA React
# Projet Kanban SI-SOR 2026
# ============================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Activation de sendfile pour servir les fichiers statiques efficacement
    sendfile on;

    # ── Redirect HTTP → HTTPS ────────────────────────────────
    server {
        listen 80;
        server_name _;

        return 301 https://$host$request_uri;
    }

    # ── Serveur principal HTTPS ──────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        # ── Certificats SSL ───────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;

        # Protocoles modernes uniquement
        ssl_protocols TLSv1.2 TLSv1.3;

        # ── Taille max des uploads (pièces jointes) ───────────
        client_max_body_size 20M;

        # ── Proxy vers Deno pour toutes les routes /api/v1 ───
        location /api/v1/ {
            proxy_pass         http://deno:8080;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            # Timeout généreux pour les uploads de fichiers
            proxy_read_timeout 60s;
        }

        # ── Fichiers statiques React (SPA) ───────────────────
        location / {
            root  /usr/share/nginx/html;
            index index.html;

            # Indispensable pour React Router :
            # toute URL inconnue renvoie index.html (le routeur React prend le relais)
            try_files $uri $uri/ /index.html;
        }
    }
}
