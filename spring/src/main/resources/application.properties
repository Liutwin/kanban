# Configuration MariaDB
spring.datasource.url=${DB_MARIA_URL}
spring.datasource.username=${DB_MARIA_USER}
spring.datasource.password=${DB_MARIA_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.profiles.active=local

# MConfiguration MongoDB
spring.data.mongodb.uri=${DB_MONGO_URL}

# Configuration JPA
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Configuration serveur
server.port=8081
server.servlet.context-path=/api/v1

# Configuration OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# Configuration des fichiers uploadés
app.upload.dir=./uploads

# Limite de taille des fichiers uploadés (lu par Spring Boot multipart auto-configuration)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Configuration mail
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=${MAIL_USERNAME}
app.base-url=${APP_BASE_URL}